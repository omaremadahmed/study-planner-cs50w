{% extends 'planner/base.html' %}
{% load static %}

{% block content %}

<h2>📚 Subjects</h2>

<a href="{% url 'add_subject' %}" class="btn-add">+ Add Subject</a>

<ul class="subjects-list">
    {% for subject in subjects %}
        <li class="subject-item">
            <a href="{% url 'subject_detail' subject.id %}" class="subject-name">{{ subject.name }}</a>

            <div class="actions">
                <a href="{% url 'edit_subject' subject.id %}" class="btn-edit">Edit</a>
                <a href="{% url 'delete_subject' subject.id %}" class="btn-delete">Delete</a>
            </div>
        </li>
    {% empty %}
        <li class="empty">No subjects yet</li>
    {% endfor %}
</ul>

{% endblock %}
