<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Study Planner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'planner/css/style.css' %}">
</head>

<body>

    {% include 'planner/navbar.html' %}

    <div class="container mt-4">
        <div id="react-root" class="mb-3"></div>
        {% block content %}{% endblock %}
    </div>

    <script src="{% static 'planner/js/main.js' %}"></script>
    <!-- React (optional enhancement; safe if not used) -->
    <script defer src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="{% static 'planner/js/react-app.js' %}"></script>
</body>
</html>
