{% extends 'planner/base.html' %}

{% block content %}

<h2>Add Subject</h2>

<form method="POST" class="form">
    {% csrf_token %}

    <label for="name">Subject Name</label>
    <input 
        type="text" 
        id="name" 
        name="name" 
        placeholder="Enter subject name" 
        required
    >

    <label for="description">Description (optional)</label>
    <textarea id="description" name="description" rows="3" placeholder="Notes"></textarea>

    <button type="submit">Add</button>
</form>

<a href="{% url 'subjects_list' %}">⬅ Back</a>

{% endblock %}
