<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">Study Planner</a>

        <div class="d-flex gap-2 flex-wrap">
            <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="{% url 'task_list' %}" class="btn btn-light btn-sm">Tasks</a>
            <a href="{% url 'subjects_list' %}" class="btn btn-light btn-sm">Subjects</a>
            <a href="{% url 'pomodoro' %}" class="btn btn-info btn-sm">Pomodoro</a>
            {% if user.is_authenticated %}
                <span class="navbar-text text-white me-2 small">{{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-warning btn-sm">Login</a>
                <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
