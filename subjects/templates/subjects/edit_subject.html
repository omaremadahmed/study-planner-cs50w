{% extends 'planner/base.html' %}

{% block content %}

<h2>Edit Subject</h2>

<form method="POST" class="form">
    {% csrf_token %}

    <label for="name">Subject Name</label>
    <input 
        type="text" 
        id="name" 
        name="name" 
        value="{{ subject.name }}" 
        required
    >

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3">{{ subject.description }}</textarea>

    <button type="submit">Save</button>
</form>

{% endblock %}
